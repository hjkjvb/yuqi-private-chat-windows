<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>下载 钰琦私密聊天室 Windows 便携版</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI","Noto Sans SC",sans-serif;background:#07080c;color:#f4efe4}
.card{width:min(440px,92vw);padding:28px 24px;border:1px solid rgba(232,185,35,.28);border-radius:16px;background:#10121a;text-align:center}
h1{margin:0 0 8px;font-size:22px}
p{margin:0 0 18px;color:#b7b1a4;font-size:14px;line-height:1.6}
button{width:100%;height:48px;border:0;border-radius:10px;background:#e8b923;color:#1a1406;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.ok{margin-top:14px;color:#7dfff0;font-size:13px}
.err{margin-top:14px;color:#ff8a80;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>钰琦私密聊天室</h1>
<p>Windows 64 位便携版（EXE + 使用说明）<br>不需要安装 Python / Node</p>
<button id="btn" type="button">下载便携包 ZIP</button>
<p class="ok" id="ok" hidden>已开始下载。解压后双击「钰琦私密聊天室.exe」</p>
<p class="err" id="err" hidden></p>
</div>
<script>
const N = 12;
function b64ToBytes(s){
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
document.getElementById("btn").onclick = async () => {
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.hidden = true;
  btn.disabled = true;
  btn.textContent = "正在组装文件…";
  try {
    const base = new URL("./", location.href).href;
    let s = "";
    for (let i=1;i<=N;i++) {
      const n = String(i).padStart(2,"0");
      const t = await fetch(base + "payload-" + n + ".txt").then(r => {
        if (!r.ok) throw new Error("读取分片失败 " + n);
        return r.text();
      });
      s += t.trim();
      btn.textContent = "正在组装文件… " + i + "/" + N;
    }
    const blob = new Blob([b64ToBytes(s)], {type:"application/zip"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "钰琦私密聊天室_Windows便携版.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
    document.getElementById("ok").hidden = false;
  } catch (e) {
    err.textContent = String(e && e.message ? e.message : e);
    err.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = "下载便携包 ZIP";
  }
};
</script>
</body>
</html>
